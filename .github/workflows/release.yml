name: Deploy and publish to MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f='server.json';const j=require('./'+f);j.version='$V';require('fs').writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      # DNS auth: needs the private key whose public key is in a TXT record on whatdafox.com
      # (see README). Swap for `mcp-publisher login github-oidc` if you use the io.github namespace.
      - name: Publish to MCP Registry
        run: |
          mcp-publisher login dns --domain whatdafox.com --private-key "${{ secrets.MCP_PRIVATE_KEY }}"
          mcp-publisher publish
